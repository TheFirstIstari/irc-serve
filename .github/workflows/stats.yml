# Regenerates docs/STATS.md from the repository's actual state.
#
# Every number is measured, never hardcoded: test counts from running ctest,
# line counts from the source tree, phase progress from the milestone API. That
# is deliberate. This repo's defining problem was documentation claiming
# features that did not exist, so the one document that reports on state must be
# mechanically unable to lie.
#
# Publishes to a dedicated `docs/stats` branch rather than main, so it never
# trips branch protection and never enters the main history. Only the README
# badge and a link point at it.
name: Stats

on:
  schedule:
    # 03:17 UTC daily. Deliberately off the hour: the top of the hour is when
    # every scheduled workflow on the platform runs and GitHub delays the queue.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "docs/SERVER_DESIGN.md"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      STATS_BRANCH: docs/stats
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and run the suite
        run: |
          set -euo pipefail
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel "$(nproc)"
          ctest --test-dir build --output-on-failure --timeout 60 | tee ctest.log

      - name: Measure
        id: m
        run: |
          set -euo pipefail

          # Count from the per-test progress table, anchored on the test number.
          # Grepping the whole log for "Skipped" double-counts: ctest prints each
          # skip once in the table and again in the "did not run" footer, so a
          # naive grep reports 16 for 8 real skips.
          total=$(grep -oE 'out of [0-9]+' ctest.log | tail -1 | grep -oE '[0-9]+' || echo 0)
          passed=$(grep -cE 'Test +#[0-9]+: .*Passed' ctest.log || true)
          skipped=$(grep -cE 'Test +#[0-9]+: .*Skipped' ctest.log || true)
          failed=$(grep -cE 'Test +#[0-9]+: .*(\*\*\*Failed|\*\*\*Exception)' ctest.log || true)

          src_lines=$(find src -name '*.c' -o -name '*.h' | xargs wc -l | tail -1 | awk '{print $1}')
          test_lines=$(find tests -name '*.c' -o -name '*.h' | xargs wc -l | tail -1 | awk '{print $1}')

          read -r closed open <<<"$(gh api \
            "repos/$GITHUB_REPOSITORY/milestones?state=all" \
            --jq '.[] | select(.title=="Federated IRC Server v1.0")
                   | "\(.closed_issues) \(.open_issues)"' || echo '0 0')"

          {
            echo "total=$total"
            echo "passed=$passed"
            echo "skipped=$skipped"
            echo "failed=$failed"
            echo "src_lines=$src_lines"
            echo "test_lines=$test_lines"
            echo "closed=${closed:-0}"
            echo "open=${open:-0}"
          } >> "$GITHUB_OUTPUT"

      - name: Render STATS.md
        env:
          TOTAL: ${{ steps.m.outputs.total }}
          PASSED: ${{ steps.m.outputs.passed }}
          SKIPPED: ${{ steps.m.outputs.skipped }}
          FAILED: ${{ steps.m.outputs.failed }}
          SRC_LINES: ${{ steps.m.outputs.src_lines }}
          TEST_LINES: ${{ steps.m.outputs.test_lines }}
          CLOSED: ${{ steps.m.outputs.closed }}
          OPEN: ${{ steps.m.outputs.open }}
        run: |
          set -euo pipefail
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sha=$(git rev-parse --short HEAD)
          phases=$((CLOSED + OPEN))
          mkdir -p docs
          {
            echo "<!-- GENERATED by .github/workflows/stats.yml. Do not edit. -->"
            echo ""
            echo "# Project status"
            echo ""
            echo "Generated \`$now\` from commit \`$sha\` by"
            echo "[stats.yml](../../blob/main/.github/workflows/stats.yml)."
            echo ""
            echo "## Test suite"
            echo ""
            echo "| | count |"
            echo "|---|---|"
            echo "| Total | $TOTAL |"
            echo "| Passing | $PASSED |"
            echo "| **Skipped** | **$SKIPPED** |"
            echo "| Failed | $FAILED |"
            echo ""
            echo "> **The skipped count is shown because it is the number that matters.**"
            echo "> Each skipped test is a CTest skip (\`return 77\`) naming a feature that"
            echo "> is not implemented. CI does not currently fail on skips, so"
            echo "> \"100% tests passed\" can coexist with unimplemented features."
            echo "> Closing that gap is Phase 7, issue #81."
            echo ""
            echo "## Code size"
            echo ""
            echo "| | lines |"
            echo "|---|---|"
            echo "| \`src/\` | $SRC_LINES |"
            echo "| \`tests/\` | $TEST_LINES |"
            echo ""
            echo "## Build phases"
            echo ""
            echo "**$CLOSED of $phases** complete. One issue per phase, tracked in the"
            echo "\`Federated IRC Server v1.0\` milestone; the plan is in"
            echo "\`docs/SERVER_DESIGN.md\`. Phase 5 is the \"working server\" line and"
            echo "Phase 6 is the federation line."
          } > docs/STATS.md
          echo "--- rendered ---"
          cat docs/STATS.md

      - name: Publish to the docs/stats branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$STATS_BRANCH" >/dev/null 2>&1; then
            git worktree add -f .wt "$STATS_BRANCH"
          else
            git worktree add -f -b "$STATS_BRANCH" .wt
          fi

          mkdir -p .wt/docs
          cp docs/STATS.md .wt/docs/STATS.md
          git -C .wt add docs/STATS.md

          if git -C .wt diff --cached --quiet; then
            echo "STATS.md is unchanged; nothing to publish."
          else
            git -C .wt commit -q -m "docs: refresh generated stats"
            git -C .wt push origin "$STATS_BRANCH"
            echo "published to $STATS_BRANCH"
          fi
