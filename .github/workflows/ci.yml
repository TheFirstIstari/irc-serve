name: CI / Test / Benchmark / Compliance

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CMake)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON -DBUILD_BENCHMARK=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Unit Tests
        id: ci_test
        working-directory: build
        run: ctest --output-on-failure --timeout 60
      - name: Benchmark (minimal footprint)
        id: ci/benchmark
        working-directory: build
        run: ctest -L Benchmark --output-on-failure
      - name: Memory-check build
        id: ci/compliance
        run: |
          echo "Compliance: verifying C spec alignment (RFC 1459 + IRCv3)"
          echo "Static analysis placeholder: cppcheck / clang-tidy"
          echo "Memory footprint target: < 10MB base per node"
  spec-compliance-check:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Check spec references
        run: |
          echo "Verifying spec links in docs/"
          test -f docs/SPEC_TRACKING.md || exit 1
