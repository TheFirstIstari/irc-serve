name: CI / Test / Benchmark / Compliance

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
ci_test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Unit Tests
        working-directory: build
        run: ctest --output-on-failure --timeout 60

  ci_benchmark:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARK=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Benchmark
        working-directory: build
        run: ctest -L Benchmark --output-on-failure || echo "Benchmark optional"

  ci_compliance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Memory-check build
        run: |
          echo "Target platforms: Debian, Arch"
          echo "Memory footprint target: < 10MB base per federated node"

  build-arch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Build (Arch target)
        run: |
          echo "Arch Linux target"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON
          cmake --build build --parallel $(nproc)
      - name: Unit Tests (Arch target)
working-directory: build
        run: ctest --output-on-failure --timeout 60
        working-directory: build
        run: ctest --output-on-failure --timeout 60

  spec-compliance-check:
    runs-on: ubuntu-latest
needs: [build-arch]
    steps:
      - uses: actions/checkout@v4
      - name: Check spec references
        run: |
          echo "Verifying spec links in docs/"
          test -f docs/SPEC_TRACKING.md || exit 1
