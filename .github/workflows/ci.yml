name: CI / Test / Benchmark / Compliance

on:
  push:
    branches: [main, feat/*, fix/*, phase/*, docs/*, ci/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Where the work runs, and why
#
# The self-hosted CachyOS runner is preferred for Linux work: it is a much
# faster machine, its toolchain is the same one the project is developed
# against, and it costs nothing against hosted minutes.
#
# Three constraints shape the layout, and each is a reason the obvious
# "move everything" version is wrong:
#
#   1. ONE RUNNER RUNS ONE JOB AT A TIME. Six separate matrix jobs on a single
#      self-hosted runner would run *serially* -- roughly 6 x 30s, slower in wall
#      clock than the parallel hosted matrix they replace. So the Linux
#      verification is one job that loops internally. Parallelism is not
#      available; sequential-but-native beats parallel-but-emulated.
#
#   2. macOS CANNOT RUN THERE. ci_macos stays on a hosted macOS runner. That is
#      not a preference, it is the platform.
#
#   3. THE MERGE GATE MUST NOT DEPEND ON A MACHINE THAT CAN BE SWITCHED OFF.
#      ci_test stays on a hosted Linux runner and stays required, so a merge is
#      still possible when the self-hosted runner is offline. If every required
#      check lived on a personal machine, powering it off would be a
#      development freeze.
#
# Exposure: ci_linux_cachyos runs on the self-hosted machine, so anything that
# reaches it executes code there. It is gated twice -- push to main only, and
# the `self-hosted` environment, whose only required reviewer is the owner and
# which the owner's own pushes bypass by design (see docs/DEVELOPMENT.md).
# ---------------------------------------------------------------------------

jobs:
  # --- Preferred path: the fast native Linux machine -----------------------
  # One job, all four compiler x build-type combinations, sequentially.
  ci_linux_cachyos:
    name: ci_linux (self-hosted)
    runs-on: [self-hosted, Linux, X64, cachyos-x8664]
    timeout-minutes: 45
    environment:
      name: ${{ github.actor == 'TheFirstIstari' && 'self-hosted-auto' || 'self-hosted' }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          set -euo pipefail
          echo "  host   : $(uname -srm)"
          echo "  distro : $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "  cmake  : $(cmake --version | head -1)"
          echo "  gcc    : $(gcc --version | head -1)"
          echo "  clang  : $(clang --version | head -1)"
      - name: Build and test every compiler and build type
        run: |
          set -euo pipefail
          rc=0
          for cc in gcc clang; do
            for bt in Release Debug; do
              echo "::group::$cc $bt"
              d="build-$cc-$bt"
              if cmake -B "$d" -S . -DCMAKE_BUILD_TYPE="$bt" -DBUILD_TESTING=ON -DCMAKE_C_COMPILER="$cc" \
                 && cmake --build "$d" --parallel "$(nproc)" \
                 && ctest --test-dir "$d" --output-on-failure --timeout 60; then
                echo "  PASS  $cc $bt"
              else
                echo "  FAIL  $cc $bt"
                rc=1
              fi
              echo "::endgroup::"
            done
          done
          exit "$rc"

  # --- Independent merge gate: hosted, so it works when the runner is off ---
  # Deliberately small and deliberately hosted. This is the check that keeps a
  # merge possible when cachyos-x8664 is offline, and the one Linux result that
  # is not produced by the maintainer's own machine.
  ci_test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Unit Tests
        working-directory: build
        run: ctest --output-on-failure --timeout 60

  # --- macOS: cannot run on the self-hosted machine -----------------------
  ci_macos:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)
      - name: Unit Tests
        working-directory: build
        run: ctest --output-on-failure --timeout 60
      - name: Verify Spec References
        shell: bash
        run: |
          test -f docs/SPEC_TRACKING.md || { echo "docs/SPEC_TRACKING.md missing" >&2; exit 1; }
          grep -q "https://datatracker.ietf.org/doc/html/rfc1459" docs/SPEC_TRACKING.md || { echo "missing RFC1459 spec reference" >&2; exit 1; }
          grep -q "https://modern.ircdocs.horse/" docs/SPEC_TRACKING.md || { echo "missing modern spec reference" >&2; exit 1; }
          grep -q "https://ircv3.net/" docs/SPEC_TRACKING.md || { echo "missing IRCv3 spec reference" >&2; exit 1; }
          echo "Spec references verified"

  # --- Advisory only, hosted ---------------------------------------------
  # Benchmark and compliance run on the hosted runner rather than the
  # self-hosted one so that their results are produced by infrastructure the
  # owner does not control. Neither is a required check, so they cost nothing
  # in merge latency and their numbers are independent of the fast machine.
  ci_benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARK=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Benchmark
        working-directory: build
        run: ctest -L Benchmark --output-on-failure --timeout 60

  ci_compliance:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Compliance Tests
        working-directory: build
        run: ctest -L Compliance --output-on-failure --timeout 60
