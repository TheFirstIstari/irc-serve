name: CI / Test / Benchmark / Compliance

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  build-debian:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON -DBUILD_BENCHMARK=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Unit Tests
        id: ci/test
        working-directory: build
        run: ctest --output-on-failure --timeout 60
      - name: Benchmark
        id: ci/benchmark
        working-directory: build
        run: ctest -L Benchmark --output-on-failure || echo "Benchmark optional"
      - name: Memory-check build
        id: ci/compliance
        run: |
          echo "Target platforms: Debian, Arch"
          echo "Memory footprint target: < 10MB base per federated node"

  build-arch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Build (Arch target)
        run: |
          echo "Arch Linux target"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON
          cmake --build build --parallel $(nproc)
      - name: Unit Tests (Arch target)
        id: ci/test
        working-directory: build
        run: ctest --output-on-failure --timeout 60

  spec-compliance-check:
    runs-on: ubuntu-latest
    needs: [build-debian, build-arch]
    steps:
      - uses: actions/checkout@v4
      - name: Check spec references
        run: |
          echo "Verifying spec links in docs/"
          test -f docs/SPEC_TRACKING.md || exit 1
