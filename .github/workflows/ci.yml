name: CI / Test / Benchmark / Compliance

on:
  push:
    branches: [main, feat/*, fix/*, phase/*, docs/*, ci/*]
  pull_request:
    branches: [main]
  # TWO SCHEDULED / MANUAL TRIGGERS, and both exist for ONE job: ci_teeth_linux.
  #
  # scripts/teeth-linux.sh is the only instrument that can answer "does THIS image's
  # ASan watch stack-use-after-return", and the question has a different answer on every
  # platform -- measured across five toolchains, and the class is off by default in
  # three of them. An instrument that nothing ever runs stops being an instrument: the
  # next change to the cell's ASAN_OPTIONS would ship unverified because running the
  # check required remembering to run it. `schedule` is the part that makes it automatic
  # rather than optional; `workflow_dispatch` is the part that lets a change to the
  # options be verified BEFORE it merges, which is the whole point of wiring it here.
  #
  # The `cron` is 04:17 UTC rather than 04:00 because the minute is a load-shaping
  # choice, not a claim: every public workflow that can be scheduled lands on the hour
  # and GitHub's scheduler is busiest at the top of the hour. Nothing here depends on
  # WHEN it runs.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Where the work runs, and why
#
# The self-hosted CachyOS runner is preferred for Linux work: it is a much
# faster machine, its toolchain is the same one the project is developed
# against, and it costs nothing against hosted minutes.
#
# Three constraints shape the layout, and each is a reason the obvious
# "move everything" version is wrong:
#
#   1. PARALLELISM IS SET BY RUNNER INSTANCES, NOT BY THE WORKFLOW. A runner
#      process handles exactly one job at a time, so a single runner serialises a
#      4-way matrix. FOUR runners are registered (cachyos-x8664-1..4) by
#      scripts/setup-self-hosted-runner.sh, all carrying the same label, so the
#      matrix below is picked up concurrently. Raise the instance count to raise
#      the ceiling.
#
#   2. macOS CANNOT RUN THERE. ci_macos stays on a hosted macOS runner. That is
#      not a preference, it is the platform.
#
#   3. THE MERGE GATE MUST NOT DEPEND ON A MACHINE THAT CAN BE SWITCHED OFF.
#      ci_test stays on a hosted Linux runner and stays required, so a merge is
#      still possible when the self-hosted runner is offline. If every required
#      check lived on a personal machine, powering it off would be a
#      development freeze.
#
# Exposure: ci_linux_cachyos runs on the self-hosted machine, so anything that
# reaches it executes code there. It is gated twice -- push to main only, and
# the `self-hosted` environment, whose only required reviewer is the owner and
# which the owner's own pushes bypass by design (see docs/DEVELOPMENT.md).
# ---------------------------------------------------------------------------

jobs:
  # --- Preferred path: the fast native Linux machine -----------------------
  # A real 4-way matrix, executed CONCURRENTLY because the machine runs six
  # runner instances. A runner process handles one job at a time, so the
  # instance count is what sets the parallelism.
  #
  # THIS JOB IS NOT DEAD, and that was worth checking rather than assuming. The
  # GitHub API reports all four combinations as `success` on each of the last
  # four merges to main (30c2aac, 118c617, 358db40, ab84b80), and each one ran
  # the gcc and clang Release/Debug cells to completion. What looks like a dead
  # job on a pull request is the `if:` below: `github.event_name == 'push'` is
  # false for a pull_request, so the job is skipped by design, and a
  # job-level `if` that evaluates false ALSO SUPPRESSES MATRIX EXPANSION --
  # which is why the skipped run shows ONE job with the literal text
  #   ci_linux ${{ matrix.compiler }} ${{ matrix.build_type }}
  # rather than four named ones. That artifact is cosmetic in the UI and is a
  # reliable signal of the cause; it is not a runner-matching failure. The
  # distinction matters, because the two have opposite fixes: "no runner
  # matched" means register a runner, and "skipped by if" means change nothing
  # about the runner at all.
  #
  # SO IT STAYS SELF-HOSTED. Moving it to ubuntu-22.04 would be a one-line
  # change that would also quietly delete the only reason this job exists:
  # cachyos is a rolling distribution carrying a newer glibc than the pinned
  # ubuntu-22.04 image, and a newer glibc declares more
  # __attribute__((warn_unused_result)) and fortify paths than the older one.
  # That is precisely the class that reached main history as a red PR --
  # `(void)read(...)`, which glibc marks __wur and the macOS SDK does not
  # declare at all. (The exact glibc release on the runner is not asserted
  # here; it was not read from the machine. The claim that ubuntu-22.04's glibc
  # already catches THAT one is not a claim about versions: it is read off the
  # ci_test log at run 37242557613, which is ubuntu-22.04's own GCC reporting
  # the diagnostic. The argument for keeping cachyos is about the NEXT one, in a
  # function nobody thought to check.) Stating that plainly: the distro breadth
  # IS preserved by keeping it, and WOULD NOT BE by moving it, and anyone
  # reading a future commit that moves this to a hosted runner should treat that
  # as a coverage regression rather than a cleanup.
  #
  # The availability cost is real and is paid on purpose: if the machine is off,
  # a push to main waits. It does NOT affect pull requests, because the `if:`
  # excludes them, so the PR-time gate -- ci_test, hosted -- is unaffected.
  ci_linux_cachyos:
    name: ci_linux ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: [self-hosted, Linux, X64, cachyos-x8664]
    timeout-minutes: 45
    environment:
      name: ${{ github.actor == 'TheFirstIstari' && 'self-hosted-auto' || 'self-hosted' }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # continue-on-error IS GONE, deliberately, and the argument is short.
    #
    # This job CANNOT gate a merge: it is push-to-main only, so by the time it
    # runs the merge has already happened. There is therefore no merge to
    # protect by tolerating its failures, and continue-on-error bought nothing
    # -- while costing the one thing a post-merge job exists to provide, which
    # is a truthful result. Under it, a Linux-only build break found only on
    # cachyos was reported as a GREEN TICK on main. A red push to main is
    # information and blocks nothing; a fake green is worse than either.
    #
    # It is also now the only job whose result can distinguish "cachyos is
    # healthy" from "cachyos never ran", since the job that used to be the
    # merge gate for Linux is post-merge by construction.
    #
    # Six runner instances are registered (cachyos-x8664-1..6), so this matrix
    # runs CONCURRENTLY rather than queueing behind a single runner.
    # Measured: `gcc Release` and `clang Debug` completed in 19s each, at the
    # same time, on the same box.
    # See scripts/setup-self-hosted-runner.sh and scripts/actions-runner@.service.
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          set -euo pipefail
          echo "  host   : $(uname -srm)"
          echo "  distro : $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "  cmake  : $(cmake --version | head -1)"
          echo "  gcc    : $(gcc --version | head -1)"
          echo "  clang  : $(clang --version | head -1)"
      - name: Build and test
        run: |
          set -euo pipefail
          # WHAT GATES A PULL REQUEST, stated here so the two are not confused:
          # ci_test, on ubuntu-22.04, with GCC against glibc, is the pre-merge
          # Linux gate and is a required check. It is what reported the
          # `(void)read(...)` __wur defect at run 37242557613, before the branch
          # was merged. THIS job cannot gate a pull request -- the `if:` above
          # excludes pull_request events -- so what it adds is a second Linux
          # distribution on a newer glibc, confirming after the fact what ci_test
          # could not reach. It is not a replacement for ci_test, and it is not
          # the only Linux evidence; it is the only Linux evidence from a
          # distro other than Ubuntu's.
          cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          # NOT $(nproc). Four matrix jobs land on this box at once, so asking each
          # for every core asks for 128 compiler processes on 32 cores. That is
          # 4x oversubscribed, and it is why ci_linux clang Debug failed in CI
          # while passing 56/56 in 8.78s when run alone on the same machine
          # (measured on cachyos-x8664). Divide instead: four jobs, so each gets a
          # quarter of the cores.
          cmake --build build --parallel "$(( $(nproc) / 4 ))"
          ctest --test-dir build --output-on-failure --timeout 60 -j 2

  # --- Independent merge gate: hosted, so it works when the runner is off ---
  # Deliberately small and deliberately hosted. This is the check that keeps a
  # merge possible when cachyos-x8664 is offline, and the one Linux result that
  # is not produced by the maintainer's own machine.
  ci_test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # BEFORE THE BUILD, on purpose: it is a text check over the working tree,
      # takes well under a second, and needs no build directory at all -- so a
      # violation should cost a second rather than the two minutes it would cost
      # at the end. It sits with the other gates rather than next to the compile
      # for the same reason it sits first among them.
      #
      # IT IS HERE, IN ci_test, BECAUSE ci_test IS THE JOB THAT CATCHES THIS
      # CLASS ON A PULL REQUEST. It is hosted Linux with GCC against glibc, and
      # it is what reported `(void)read(...)` as
      #   error: ignoring return value of 'read' declared with attribute
      #   'warn_unused_result' [-Werror=unused-result]
      # at run 37242557613, before that branch merged. Nothing here replaces
      # that; see the script for why it cannot.
      #
      # WHAT IT ADDS ON TOP is that it fails on ANY host. Both required macOS
      # cells passed that build clean -- the macOS SDK does not declare read()
      # with warn_unused_result at all -- and Clang stays silent even against
      # real glibc headers, because it exempts an explicit (void) cast. So the
      # defect was simultaneously invisible to every macOS cell and to any
      # Clang-based Linux cell, and visible only to GCC-on-glibc. A grep is not
      # cleverer than that build; it is simply available on a machine that has
      # no glibc, which is where a contributor's laptop is.
      - name: glibc __wur discard gate
        run: ./scripts/check-wur-discards.sh
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      # shell: bash, and not the default, for ONE reason: the default is
      # `bash -e {0}`, which has no pipefail, so `ctest | tee` would return tee's
      # status and a FAILED suite would sail through this job. `shell: bash` is
      # `bash --noprofile --norc -eo pipefail`, which is what makes the tee below
      # safe.
      - name: Unit Tests
        working-directory: build
        shell: bash
        run: ctest --output-on-failure --timeout 60 -j 2 | tee ctest.log
      # THE SKIP RATCHET. It is a step of its own rather than part of the ctest
      # invocation because it is a different KIND of check: ctest's exit code
      # cannot express "a test skipped", and that blind spot is what let 8 dead
      # tests pass unnoticed. It reads the log the step above wrote, so the suite
      # is not run twice.
      #
      # It is NOT "fail if any test skips". A test that skips without a line in
      # tests/known_skips.txt is a FAILURE, and so is a listed skip that is no
      # longer skipping -- the second direction is what makes the list a ratchet
      # rather than an allowlist that rots. Five skips are permitted today, all
      # of them allocated by 7/Phase 9 to a phase that has not run;
      # docs/SERVER_DESIGN.md 6.4 explains why "zero" is not reachable before then
      # and what the list is instead.
      - name: Skip gate (ratchet)
        run: ./scripts/check-skips.sh -b build build/ctest.log

      # No AI attribution in this repository's history. Attribution was stripped
      # from main twice by rewriting history and came back both times, because a
      # rewrite only says something about the PAST and nothing about the next
      # commit. This says something about the next commit, which is the part that
      # was still unguarded.
      #
      # The range is the merge base with the base branch, so an ordinary PR is
      # checked for what it ADDS rather than for all of history. Copilot is
      # deliberately NOT matched: those are the operator's own commits made in
      # GitHub's editor, and they are wanted.
      - name: Attribution gate (this PR)
        if: github.event_name == 'pull_request'
        run: ./scripts/check-attribution.sh "origin/${{ github.base_ref }}" HEAD
      - name: Attribution gate (this push)
        if: github.event_name == 'push'
        run: ./scripts/check-attribution.sh "origin/${{ github.ref_name }}" HEAD

  # --- macOS: cannot run on the self-hosted machine -----------------------
  # WITH_TLS IS A MATRIX DIMENSION HERE, AND UNTIL THIS COMMIT IT WAS NOT
  # ANYWHERE ELSE ON THIS RUNNER. That was the defect: src/tls_openssl.c is 663
  # lines and it is the entire security boundary -- every SSL_new, SSL_read,
  # SSL_free and SSL_CTX lifetime in the project lives in that one file. Until
  # now, NO REQUIRED CHECK COMPILED IT. ci_macos configured with no -DWITH_TLS,
  # and WITH_TLS defaults to OFF, so every macOS cell built src/tls_none.c
  # instead. The only job that has ever compiled the file was the advisory,
  # continue-on-error ci_sanitizers ON cell. A required check that does not
  # compile the code is not a gate on that code.
  #
  # WHY THE OPENSSL DEPENDENCY IS INSTALLED FOR ONE CELL AND NOT THE OTHER.
  # src/CMakeLists.txt's WITH_TLS comment states the project's dependency claim:
  # eleven phases with no third-party package, and README says so in three
  # places. The OFF cell is what PROVES that claim, because it installs nothing
  # and still builds and passes. An unconditional `brew install openssl` would
  # make the OFF cell green whether or not the default build needs OpenSSL --
  # it would delete the experiment rather than run it. So the install step is
  # conditional on the ON cell, and the step below asserts that the OFF cell's
  # binary does not link libssl at all.
  #
  # macos-latest IS ARM64 and Homebrew lives in /opt/homebrew there. openssl@3
  # is a KEG-ONLY formula, so it is deliberately not symlinked into
  # $(brew --prefix)/lib and FindOpenSSL does not find it on its own -- hence
  # OPENSSL_ROOT_DIR, exported from the formula's real prefix rather than
  # hardcoded, so the cell keeps working if the runner's prefix or the formula's
  # version changes.
  ci_macos:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # matrix.include WITH AN EXPLICIT `name` PER CELL, and the reason is
      # operational rather than stylistic. This job's two OFF cells keep their
      # EXACT historical check names, "ci_macos (Release)" and "ci_macos
      # (Debug)", because those two strings are what branch protection is
      # already configured to require. Had the name been built by
      # interpolation -- name: ci_macos (${{ matrix.build_type }}) -- every cell
      # would have gained a suffix, the two required contexts would stop being
      # reported, and EVERY pull request would hang waiting for a check name
      # that can no longer arrive. Adding two required names is a settings
      # change the maintainer makes once; renaming the two existing ones is a
      # broken gate until they do.
      matrix:
        include:
          - name: ci_macos (Release)
            build_type: Release
            with_tls: "OFF"
          - name: ci_macos (Debug)
            build_type: Debug
            with_tls: "OFF"
          - name: ci_macos (Release) WITH_TLS=ON
            build_type: Release
            with_tls: "ON"
          - name: ci_macos (Debug) WITH_TLS=ON
            build_type: Debug
            with_tls: "ON"
    name: ${{ matrix.name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # ON cell only. See the job comment: unconditional installation would
      # destroy the zero-dependency claim the OFF cell exists to prove.
      - name: Install OpenSSL (WITH_TLS=ON only)
        if: matrix.with_tls == 'ON'
        shell: bash
        run: |
          set -euo pipefail
          brew install openssl@3
          prefix=$(brew --prefix openssl@3)
          echo "prefix : ${prefix}"
          echo "openssl: $(brew --prefix openssl@3)/bin/openssl version"
          echo "OPENSSL_ROOT_DIR=${prefix}" >> "$GITHUB_ENV"
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "  host     : $(uname -srm)"
          echo "  cmake    : $(cmake --version | head -1)"
          echo "  compiler : $(cc --version | head -1)"
          if [ "${{ matrix.with_tls }}" = "ON" ]; then
            echo "  OPENSSL_ROOT_DIR=${OPENSSL_ROOT_DIR:-<unset>}"
          else
            echo "  OPENSSL_ROOT_DIR=${OPENSSL_ROOT_DIR:-<unset>}  (expected unset: the default"
            echo "             build must find no OpenSSL at all)"
          fi
      # OPENSSL_ROOT_DIR is passed explicitly, and only for the ON cell. It is
      # in the environment already, but FindOpenSSL reads a CACHE variable and
      # an ENVIRONMENT variable, and being explicit means the configure line in
      # the log says where OpenSSL came from instead of leaving it to be
      # inferred from a passing build.
      - name: Configure
        run: |
          set -euo pipefail
          if [ "${{ matrix.with_tls }}" = "ON" ]; then
            cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DBUILD_TESTING=ON -DWITH_TLS=ON -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}"
          else
            cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DBUILD_TESTING=ON -DWITH_TLS=OFF
          fi
      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)
      # THIS STEP IS WHY THE MATRIX DIMENSION IS NOT DECORATIVE.
      #
      # WITH_TLS is opt-in, so a misspelled or ignored -D produces a build with
      # no error anywhere that silently compiles tls_none.c in all four cells and
      # reports four green ticks for a TLS backend that was never compiled. The
      # object file is therefore asserted, not assumed: the two backends are
      # selected by a generator expression in src/CMakeLists.txt and land in the
      # static library under different names, so the archive says which one was
      # compiled. The linked binary is asserted too, because a translation unit
      # being compiled is weaker than the TLS actually being reachable.
      #
      # The OFF cell's assertion is the zero-dependency claim made executable:
      # it asserts libssl and libcrypto are ABSENT from the shipped binary's
      # dependencies. That is a stronger statement than "we did not install
      # OpenSSL" -- it is a statement about what got linked.
      - name: Assert which TLS backend was actually compiled
        shell: bash
        run: |
          set -euo pipefail
          archive=build/src/libirc_core.a
          test -f "$archive" || { echo "::error::$archive missing" >&2; exit 1; }
          members=$(ar t "$archive")
          echo "TLS objects in $archive:"
          echo "$members" | grep -i tls | sed 's/^/  /'
          has_openssl=$(echo "$members" | grep -cx 'tls_openssl.c.o' || true)
          has_none=$(echo "$members" | grep -cx 'tls_none.c.o' || true)
          if [ "${{ matrix.with_tls }}" = "ON" ]; then
            [ "$has_openssl" = "1" ] || {
              echo "::error::WITH_TLS=ON was requested but tls_openssl.c.o is not in $archive. The OpenSSL backend was NOT compiled, so this cell proves nothing about src/tls_openssl.c." >&2
              exit 1
            }
            [ "$has_none" = "0" ] || {
              echo "::error::WITH_TLS=ON also linked tls_none.c.o; the two backends must be mutually exclusive" >&2
              exit 1
            }
            otool -L build/src/irc-serve | grep -q libssl || {
              echo "::error::build/src/irc-serve does not link libssl under WITH_TLS=ON" >&2
              exit 1
            }
            echo "OK: tls_openssl.c.o compiled and libssl linked"
          else
            [ "$has_openssl" = "0" ] || {
              echo "::error::WITH_TLS=OFF still compiled tls_openssl.c.o" >&2
              exit 1
            }
            [ "$has_none" = "1" ] || {
              echo "::error::WITH_TLS=OFF did not compile tls_none.c.o; expected the stub backend" >&2
              exit 1
            }
            if otool -L build/src/irc-serve | grep -qE 'libssl|libcrypto'; then
              echo "::error::WITH_TLS=OFF linked OpenSSL. The zero-dependency default build must not." >&2
              otool -L build/src/irc-serve | grep -E 'libssl|libcrypto' | sed 's/^/  /' >&2
              exit 1
            fi
            echo "OK: tls_none.c.o compiled, no OpenSSL linked (zero-dependency default holds)"
          fi
      - name: Unit Tests
        working-directory: build
        run: ctest --output-on-failure --timeout 60 -j 2
      # THE THIRD COMPILER FAMILY FOR THE OPT-IN PROBES. ci_optin_probes builds
      # them under gcc and upstream clang; this step builds them under Apple
      # clang, which is the compiler this repository's own warning set is
      # strictest under (-Weverything) and the one that reported the
      # `-Wnewline-eof` defect in lsan_probe.c.
      #
      # IT IS ONE OF FOUR CELLS AND NOT FOUR, because compiling two translation
      # units is seconds and because a check repeated four times reports the same
      # thing four times. The Release / WITH_TLS=OFF cell is where it lives; the
      # probes do not use TLS and do not use the suite, so the cheapest cell is
      # the honest place for them. Its own build directory, because the cell's
      # `build` was configured WITHOUT -DIRC_LSAN_PROBE and reusing it would test
      # a cached configuration rather than this one.
      #
      # BUILDING, NOT RUNNING, and ci_optin_probes says at length why: both probes
      # fail by design on a platform that is not watching the class they assert.
      # macOS is exactly such a platform for lsan_probe -- LeakSanitizer does not
      # exist on Darwin -- so running it here would be a guaranteed red tick about
      # the platform rather than about the tree.
      - name: Compile the opt-in sanitizer probes (Apple clang)
        if: matrix.build_type == 'Release' && matrix.with_tls == 'OFF'
        shell: bash
        run: |
          set -euo pipefail
          echo "  cc : $(cc --version | head -1)"
          targets=$(awk '
            /^if\(IRC_LSAN_PROBE\)/ { inblk = 1; next }
            inblk && /^[[:space:]]*add_executable\(/ {
              line = $0
              sub(/^[[:space:]]*add_executable\(/, "", line)
              sub(/[^A-Za-z0-9_].*$/, "", line)
              print line
              next
            }
            inblk && /^endif\(\)/ { inblk = 0; next }
            inblk { next }
          ' tests/integration/CMakeLists.txt)
          if [ -z "$targets" ]; then
            echo "::error::no add_executable() inside the if(IRC_LSAN_PROBE) block; this step would compile nothing and report success" >&2
            exit 1
          fi
          echo "  opt-in targets: $(echo $targets)"
          cmake -B build-probes -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARK=OFF -DWITH_TLS=OFF -DIRC_LSAN_PROBE=ON \
            2>&1 | tail -3
          cmake --build build-probes --parallel $(sysctl -n hw.ncpu) --target $targets \
            2>&1 | tee build-probes.build.log
          errs=$(grep -c 'error:' build-probes.build.log || true)
          warns=$(grep -c 'warning:' build-probes.build.log || true)
          echo "  build: errors=$errs warnings=$warns"
          [ "$errs" = "0" ] && [ "$warns" = "0" ] || {
            grep -m8 -E 'error:|warning:' build-probes.build.log >&2
            exit 1
          }
          for t in $targets; do
            bin="build-probes/tests/integration/$t"
            [ -x "$bin" ] || { echo "::error::$bin was not produced" >&2; exit 1; }
            echo "  $bin built"
          done
          echo "OK: the opt-in probes compile clean under Apple clang (built, not run)"
      - name: Verify Spec References
        shell: bash
        run: |
          test -f docs/SPEC_TRACKING.md || { echo "docs/SPEC_TRACKING.md missing" >&2; exit 1; }
          grep -q "https://datatracker.ietf.org/doc/html/rfc1459" docs/SPEC_TRACKING.md || { echo "missing RFC1459 spec reference" >&2; exit 1; }
          grep -q "https://modern.ircdocs.horse/" docs/SPEC_TRACKING.md || { echo "missing modern spec reference" >&2; exit 1; }
          grep -q "https://ircv3.net/" docs/SPEC_TRACKING.md || { echo "missing IRCv3 spec reference" >&2; exit 1; }
          echo "Spec references verified"

  # --- Advisory: AddressSanitizer + UndefinedBehaviorSanitizer (issue #92) ---
  # Nothing in this suite was going to catch a use-after-free, and issue #102 is
  # the proof rather than the argument: a client that closed its laptop freed a
  # conn_t that WHO then dereferenced, on a path as ordinary as a dropped TCP
  # connection, and the whole suite was green. A read of freed memory that
  # happens to return bytes nobody uses is invisible to a test written in C --
  # only a sanitizer knows the allocation is gone. So this job is the gate, and
  # it needed building rather than switching on: there was no way to compile the
  # tree with -fsanitize at all, and the integration tests exec the shipped
  # binary, so instrumenting only the test executables would have asserted
  # against an uninstrumented node and reported a clean run.
  #
  # LINUX ONLY, and that is not a preference. LeakSanitizer is unsupported on
  # Darwin, and an ASan binary built with detect_leaks=1 HANGS on macOS instead
  # of reporting, so a macOS run of this configuration is not a slower version of
  # this job -- it is a job that hangs. The hosted Linux runner is used rather
  # than the self-hosted one for ci_test's reason, sharpened: this gate must
  # produce a result on infrastructure the maintainer does not control.
  #
  # THIS JOB GATES NOW. continue-on-error is gone, and the decision rests on the
  # job's own run history rather than on a preference about sanitizers, because
  # "should a sanitizer gate" is a question about whether it has ever produced a
  # false positive, and that is answerable here. Every ci_sanitizers failure in
  # this repository, from the API's job list and the run logs:
  #
  #     8  LeakSanitizer: detected memory leaks  -- REAL findings, all fixed.
  #        "Reconnect" leaked 4096 bytes in 1 allocation and 8192 in 2;
  #        test_account and test_batch leaked 4096 in 1. Reproducible across
  #        consecutive runs at a consistent byte count, which is what a real leak
  #        looks like and not what a flake looks like.
  #     2  Build step -- the `(void)read(...)` __wur break at run 37242557613,
  #        a compile error that ci_test also reported.
  #     1  AutoScale -- an ordinary test failure that ci_test also reported.
  #     0  AddressSanitizer memory errors and 0 UndefinedBehaviorSanitizer
  #        runtime errors. Not one, across every run.
  #
  # So the honest reading is the OPPOSITE of the usual one. The instinct is to
  # gate ASan/UBSan as "deterministic" and hold LSan back as the flaky one, and
  # for this tree that is backwards: LSan is the half with proven value (it caught
  # eight real leaks) AND proven stability (49 green runs since, and zero noise
  # reports among the failures), while ASan/UBSan are the halves with no observed
  # firing at all. Gating on an unproven capability is not "cautious", it is
  # claiming a result nobody has seen. Gating on LSan is claiming a result that
  # is in the log.
  #
  # WHY NOT SPLIT IT IN TWO THEN, to gate only the proven half? Because it would
  # double the configure/build/85-test cycles for no additional detection: one
  # instrumented binary runs all three checks, and detect_leaks=1 does not
  # displace the other two. Splitting would spend hosted minutes to hold the
  # unproven half to a lower standard, which is the opposite of the point.
  #
  # WHAT "GATES" STILL REQUIRES FROM THE MAINTAINER: this job is not in the
  # required-check list, so removing continue-on-error means it can fail a
  # WORKFLOW but still cannot block a MERGE until its two names are added to main
  # branch protection. That is a settings change, not a workflow change.
  ci_sanitizers:
    name: ci_sanitizers (ASan+UBSan) WITH_TLS=${{ matrix.with_tls }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
    # TWO CELLS, AND THE SECOND ONE IS THE ONLY DYNAMIC LEAK CHECK THIS PROJECT
    # WILL EVER HAVE FOR THE TLS CODE.
    #
    # LeakSanitizer is Linux-only: it is not supported on Darwin, and an ASan binary
    # built with detect_leaks=1 HANGS on macOS rather than reporting, which is why
    # the job below is hosted Linux and why every other sanitizer claim in this file
    # says "Linux only". That has a consequence worth stating plainly: before this
    # matrix dimension, EVERY sanitizer run in this repository was a build with
    # -DWITH_TLS=OFF, and a WITH_TLS=OFF build compiles ZERO tokens of OpenSSL. So
    # the dynamic leak check was proving nothing whatsoever about `SSL*` or
    # `SSL_CTX*` -- the two allocation families that Phase 12 introduces, and the
    # two that a refactor is most likely to leak.
    #
    # The TLS code's own release paths are therefore argued STATICALLY, in
    # src/tls_openssl.c's header comment ("WHERE EVERY SSL* IS FREED, reasoned
    # statically"), which names the single release site per allocation and says
    # plainly that the argument cannot be verified on Darwin. That comment is not a
    # substitute for this cell; it is the reason this cell is mandatory rather than
    # nice-to-have. Nothing about the TLS teardown may be changed on the strength of
    # a local run.
    #
    # fail-fast: false so a leak in the TLS cell does not hide the OFF cell's result
    # (or the other way round); the two answer different questions and one of them
    # failing is information.
    strategy:
      fail-fast: false
      matrix:
        # QUOTED, and that is not tidiness. `ON` and `OFF` are YAML 1.1 booleans,
        # so an unquoted pair is a matrix of `true`/`false` to at least one parser,
        # and `-DWITH_TLS=true` is a value no reader of the log would recognise as
        # the OFF cell. Quoted, the configure line reads
        # `-DWITH_TLS=OFF` / `-DWITH_TLS=ON` exactly as the documented gate runs it,
        # and `matrix.with_tls == 'ON'` compares against the string.
        with_tls: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      # libssl-dev for the WITH_TLS=ON cell. Conditional rather than unconditional
      # so the OFF cell still proves the zero-dependency build needs no third-party
      # development package at all -- which is the dependency decision Phase 12 was
      # built around, and a step that installed OpenSSL unconditionally would stop
      # that from being checked by this job.
      - name: Install OpenSSL headers (WITH_TLS=ON only)
        if: matrix.with_tls == 'ON'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev
          openssl version
      - name: Toolchain
        run: |
          set -euo pipefail
          echo "  host   : $(uname -srm)"
          echo "  gcc    : $(gcc --version | head -1)"
      # Release, not Debug, on purpose. The suite is assert()-based outside the
      # integration tests (only TF_CHECK is used there), and those asserts are
      # compiled out of a Release build unless -UNDEBUG reaches them -- so a
      # Debug sanitizer run would quietly check less than the build CI gates on.
      # The step below proves the flag is actually there rather than assuming it.
      - name: Configure
        run: |
          set -euo pipefail
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DWITH_TLS=${{ matrix.with_tls }} \
            -DBUILD_BENCHMARK=ON \
            -DIRC_SANITIZE=ON \
            -DIRC_LSAN_PROBE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      # -DIRC_LSAN_PROBE=ON ADDS ONE TEST, and what it is for is the claim this whole
      # job makes. Everything else here reports "0 leaks", and a suppressed check cannot
      # report a leak that is not there -- so "0 leaks" is ALSO what a build with leak
      # detection switched off, or wired to nothing, reports. The probe is
      # tests/integration/lsan_probe.c: it makes a child leak 64 KiB ON PURPOSE and
      # FAILS unless LeakSanitizer reports the leak, names the byte count, and exits
      # non-zero. So this job now proves the leak oracle is live before it reports what
      # the leak oracle found, which is the one thing a count of zero cannot do for
      # itself.
      #
      # It is opt-in in CMake (`option(IRC_LSAN_PROBE ... OFF)`) and so the default
      # build and the default test count are unchanged; it is ON HERE because this is
      # the job whose entire claim is about leaks. Note that it raises this job's test
      # count from 100 to 101, which is why nothing in this repository pins the count.
      #
      # The option is opt-in, so a misspelled -D would produce a completely
      # uninstrumented build that passes every test and reports a green gate for
      # a sanitizer that is not running. Three things have to be true and are
      # therefore checked rather than assumed:
      #   1. every translation unit carries the flags, tests AND the node;
      #   2. -UNDEBUG survived, so the assert()-based tests are still asserting;
      #   3. the binary the integration tests exec is the instrumented one.
      - name: Verify the instrumented build is what is under test
        run: |
          set -euo pipefail
          # compile_commands.json is parsed rather than grepped. Grepping it is
          # wrong in a way that looks right: a "command" line carries every -I
          # path in the build, so a text match for a test directory matches
          # translation units that have nothing to do with it.
          python3 - <<'PY'
          import json, re, sys

          # Only the directories whose tests are assert()-based. The integration
          # tests use TF_CHECK, which is never compiled out, so -UNDEBUG is
          # load-bearing for these and not for those.
          assert_dirs = re.compile(r"/tests/(protocol|compliance|contracts|federation|loadbal)/")
          entries = json.load(open("build/compile_commands.json"))
          total = len(entries)
          instrumented = [e for e in entries if "-fsanitize=address,undefined" in e["command"]]
          asserted = [e for e in entries if assert_dirs.search(e["file"])]
          asserted_live = [e for e in asserted if "-UNDEBUG" in e["command"]]
          # -UNDEBUG only works if it comes AFTER -DNDEBUG on the command line.
          ordered = all(
              e["command"].index("-UNDEBUG") > e["command"].index("-DNDEBUG")
              for e in asserted_live if "-DNDEBUG" in e["command"])
          print(f"translation units: {total}, instrumented: {len(instrumented)}")
          print(f"assert-based test TUs: {len(asserted)}, carrying -UNDEBUG: {len(asserted_live)}, "
                f"and after -DNDEBUG: {ordered}")
          bad = []
          if len(instrumented) != total:
              bad.append("every translation unit must be instrumented, including the node and every test")
          if len(asserted_live) != len(asserted) or not ordered:
              bad.append("-UNDEBUG must reach the assert()-based tests, after -DNDEBUG, "
                         "or a Release build compiles their assertions away")
          for problem in bad:
              print(f"::error::{problem}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY
          # The integration tests exec $<TARGET_FILE:irc-serve>, so an
          # uninstrumented node would mean the job tests the harness and nothing
          # else. This is the check that makes the job able to catch #102 at all.
          # ldd's output goes through a variable rather than a pipe: under
          # pipefail, `ldd | grep -q` can fail on SIGPIPE when grep exits first,
          # which turns a passing check into a spurious failure.
          deps=$(ldd build/src/irc-serve)
          echo "shipped binary dynamic dependencies:"
          echo "$deps" | grep -Ei 'asan|ubsan' || {
            echo "::error::build/src/irc-serve does not link a sanitizer runtime, so the integration tests are running against an uninstrumented node" >&2
            exit 1
          }
      - name: Unit Tests
        working-directory: build
        env:
          # detect_leaks=1 is the part that only works here, and the part that
          # finds the leaks a green suite cannot see. halt_on_error=1 turns a
          # UBSan diagnostic into a failed run rather than a line in a log that
          # nobody reads: a sanitizer configured to print and carry on is a
          # sanitizer nobody acts on.
          #
          # detect_stack_use_after_return=1 IS ADDED IN THIS CHANGE and the two
          # numbers in the job's name are why. This job printed a count of
          # AddressSanitizer findings and never said what it was watching, and
          # `stack-use-after-return` -- the class that found this project's real
          # nf_free() registry defect -- defaults to OFF in the gcc on
          # ubuntu-22.04 (measured: with detect_leaks=1 alone, a deliberate
          # use-after-return of a returned frame is SILENT, the read returns its
          # value and the process exits 0). A bare `AddressSanitizer 0` above a
          # count of leaks therefore said nothing about the one class this
          # project has actually been bitten by. The default differs by
          # toolchain, so passing it explicitly is what makes the claim a
          # configuration's rather than an image's.
          #
          # MEASURED, 2026-10-10, on this runner image and on the maintainer's
          # macOS machine, with the shipped asan_coverage_probe:
          #   ubuntu-22.04 gcc 11.4   detect_leaks=1                      -> stack-use-after-return NOT-COVERED
          #   macOS Homebrew gcc 16.2  detect_leaks=0                      -> stack-use-after-return NOT-COVERED
          #   macOS Homebrew gcc 16.2  detect_leaks=0:+=return=1          -> all four classes PROVED
          #   macOS Apple clang 21.0   detect_leaks=0:+=return=1          -> stack-use-after-SCOPE NOT-COVERED
          # The scope row is a real gap and it is NOT closed here: it is a COMPILE
          # flag (-fsanitize-address-use-after-scope), it changes what the whole
          # suite is instrumented to find, and turning it on is a separate
          # decision with its own cost. It is named here so that the coverage
          # statement below is read as a per-class claim, which is the only honest
          # form of it, rather than as one number about everything.
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1
        # `shell: bash` and not the default, for the reason ci_test gives: the
        # default is `bash -e {0}`, which has no pipefail, so `ctest | tee` would
        # return tee's status and a FAILED suite would sail through a job that is
        # now a gate rather than an advisory.
        shell: bash
        run: ctest --output-on-failure --timeout 120 -j 2 | tee ctest.log
      # THE SKIP RATCHET, HERE TOO, and the reason is specific to this job
      # rather than a copy of ci_test's. The WITH_TLS=ON cell is the only place
      # any host ever leak-checks SSL* and SSL_CTX*, and that check is performed
      # BY test_tls and test_peer_tls. If either of them ever started skipping,
      # this cell would keep reporting 85/85 and LeakSanitizer would keep
      # reporting nothing -- not because there are no leaks, but because the code
      # that allocates them was never run. A green leak check that has quietly
      # stopped exercising the allocation is the exact failure this job exists to
      # prevent, so the ratchet is the step that keeps it honest.
      #
      # Cheap here because tests/known_skips.txt is EMPTY -- Phase 9 retired all
      # five of its entries, so the gate is "no test may skip" and there is no
      # permitted set to reconcile. Verified against a real log: with the list
      # empty and nothing skipped, check-skips.sh reports "the gate has nothing to
      # check and found nothing" and exits 0 rather than treating the absent skip
      # block as unreadable.
      - name: Skip gate (ratchet)
        run: ./scripts/check-skips.sh -b build build/ctest.log

      # -------------------------------------------------------------------------
      # WHAT THIS JOB WAS WATCHING, STATED PER CLASS.
      #
      # Everything above reports "0 leaks" and "0 AddressSanitizer findings". A count
      # of zero is only a statement about what was being watched, so this job said
      # nothing and a reader had to assume. That assumption was wrong for one class
      # until the ASAN_OPTIONS change above; the general form of the defect is that a
      # count cannot distinguish "clean" from "not looking", and this step is the
      # answer to that.
      #
      # IT RUNS THE PROBE DIRECTLY AND NOT THROUGH CTEST, and the reason is written
      # down in tests/integration/CMakeLists.txt: ctest reports one thing -- "a test
      # failed" -- and here a failure means "this image was not watching a class",
      # which is a fact about the GATE rather than about the software. Printing that
      # as a red suite line would be the misleading report this project keeps finding.
      # scripts/gate-linux-cell.sh's Linux cell does exactly this and reads as
      # intended; this job does the same thing.
      #
      # THE RENDERER IS scripts/gate-linux-cell.sh --report-render, reused rather than
      # reimplemented, and its EXIT STATUS is the completeness verdict. Three copies
      # of "is this report complete" is three answers, which is precisely how the
      # Linux cell came to have one answer too few. One renderer means a coverage
      # statement edited out of it takes this job red as well as taking the Linux
      # cell red.
      #
      # MACHINE AND TOOLCHAIN ARE NAMED because this is the only sanitizer claim in
      # this repository about a hosted Linux image, and it is about THIS one.
      # -------------------------------------------------------------------------
      - name: State what the sanitizers were watching
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
        run: |
          set -euo pipefail
          probe=build/tests/integration/asan_coverage_probe
          test -x "$probe" || {
            echo "::error::$probe was not built, so this job cannot state what it was watching." >&2
            echo "::error::The Configure step above passes -DIRC_LSAN_PROBE=ON; that is what builds it." >&2
            exit 1
          }
          echo "  host     : $(uname -srm)"
          echo "  gcc      : $(gcc --version | head -1)"
          echo "  ctest    : $(ctest --version | head -1)"
          echo "  probe    : $probe"
          echo "  ASAN_OPTIONS: $ASAN_OPTIONS"
          echo
          # The probe's exit status is deliberately NOT propagated here. It is
          # non-zero exactly when a class is unproved, and the render below turns
          # that into a sentence naming the class and the option -- which is the
          # difference between a red job a reader can act on and a red job they
          # have to bisect.
          "$probe" >build/asan-coverage.log 2>&1 || true
          grep '^COVER ' build/asan-coverage.log || true
          echo
          echo "ci_sanitizers coverage statement -- the counts this job reported apply to these classes only:"
          sh scripts/gate-linux-cell.sh --report-render <build/asan-coverage.log

  # --- The opt-in probes get COMPILED in CI, and that is the whole job -------
  # WHY THIS JOB EXISTS. `-DIRC_LSAN_PROBE=ON` builds two executables that no
  # default configuration builds: tests/integration/lsan_probe.c and
  # tests/integration/asan_coverage_probe.c. Both are the only thing standing
  # between this project's sanitizer claims and a number that means nothing, and
  # both had been shipped for a pass with defects in them that no build ever saw:
  # a missing newline at EOF (Apple clang, -Wnewline-eof) and a set-but-unused
  # global (upstream clang, -Wunused-but-set-global). Neither was caught because
  # NOTHING COMPILED THE FILE. A source file that no configuration builds is not
  # tested code; it is text, and it can fail to compile for ever.
  #
  # ADDED IN THIS CHANGE, and the defect it immediately found is the reason to
  # believe the rest: `asan_coverage_probe.c` did not compile under gcc 16.2 at
  # all, because of `[-Werror=dangling-pointer=]` on a store the case is REQUIRED
  # to make. The mitigation already in the file -- an `__attribute__((no_dangling_pointer))`
  # guarded by `__has_attribute` -- expanded to NOTHING on all three compilers the
  # gate uses, because none of them answers true for it. So it suppressed nothing
  # anywhere, and the file had been unbuildable by one of the project's three
  # compilers for the whole of its life. See the comment at that store.
  #
  # WHY IT BUILDS AND DOES NOT RUN. ctest cannot distinguish "this toolchain was
  # not watching" from "this build found a defect", which is exactly why
  # scripts/gate-linux-cell.sh runs the coverage probe DIRECTLY and prints a COVER
  # line per class. Running them here would reintroduce the ambiguity this
  # project keeps paying for: a red job that means "no LeakSanitizer on this
  # image" and a red job that means "your node leaks" would be the same line.
  # BUILDING is the minimum that removes the defect class, and it is the whole
  # class: a file that will not compile is a file nobody can run either.
  #
  # WHY TWO COMPILERS HERE AND A THIRD IN ci_macos. This job gets gcc and upstream
  # clang, which are the two compilers ubuntu-22.04 ships; ci_macos builds the
  # same two probes under Apple clang. Between the three jobs every compiler
  # family this project gates on compiles the opt-in sources on every push and
  # every pull request. The compilers are not the versions the local gate uses
  # (gcc 16.2 / clang 23.1.2 / Apple clang 21.0.0 on the maintainer's macOS
  # machine); they are the compilers CI has, and a diagnostic that only one
  # version reports is better caught by three families than by three exact
  # versions nobody can install in a hosted runner.
  ci_optin_probes:
    name: ci_optin_probes ${{ matrix.compiler }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      # NO SILENT SKIP. A missing compiler must be a red job, not a green one
      # with a note: this job's entire content is "these two files compile", and
      # a job that quietly declines to compile them is the defect this job
      # exists to remove, wearing a new hat.
      - name: Toolchain
        run: |
          set -euo pipefail
          echo "  host   : $(uname -srm)"
          echo "  cmake  : $(cmake --version | head -1)"
          command -v ${{ matrix.compiler }} >/dev/null 2>&1 || {
            echo "::error::${{ matrix.compiler }} is not on this runner image; this job cannot compile the opt-in probes with it" >&2
            exit 1
          }
          echo "  cc     : $(${{ matrix.compiler }} --version | head -1)"
      # THE TARGET LIST IS READ OUT OF THE CMAKE BLOCK, not written here. Three
      # copies of "which executables does IRC_LSAN_PROBE build" is three answers,
      # and a fourth probe added to that block tomorrow would otherwise compile
      # in the Linux cell and nowhere else -- which is the entire failure mode
      # this job was added for. An EMPTY derivation is a failure too: deleting the
      # block, or renaming the option, must not turn this job into one that
      # cheerfully compiles nothing.
      - name: Resolve the opt-in target list from the CMake block
        id: targets
        run: |
          set -euo pipefail
          list=$(awk '
            /^if\(IRC_LSAN_PROBE\)/ { inblk = 1; next }
            inblk && /^[[:space:]]*add_executable\(/ {
              line = $0
              sub(/^[[:space:]]*add_executable\(/, "", line)
              sub(/[^A-Za-z0-9_].*$/, "", line)
              print line
              next
            }
            inblk && /^endif\(\)/ { inblk = 0; next }
            inblk { next }
          ' tests/integration/CMakeLists.txt)
          if [ -z "$list" ]; then
            echo "::error::no add_executable() was found inside the if(IRC_LSAN_PROBE) block of tests/integration/CMakeLists.txt, so this job would compile nothing and report success" >&2
            exit 1
          fi
          echo "opt-in targets declared by IRC_LSAN_PROBE:"
          echo "$list" | sed 's/^/  /'
          echo "targets=$list" >> "$GITHUB_OUTPUT"
      # A build directory of its own, and NOT `build`: this job configures with
      # -DIRC_LSAN_PROBE=ON, and reusing the directory any other job wrote would
      # mean a cached configuration whose option state is not the one below. A
      # typo in an option name is the exact failure the ci_sanitizers "Verify the
      # instrumented build" step documents, and the same defence applies.
      - name: Configure
        run: |
          set -euo pipefail
          cmake -B build-probes -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARK=OFF \
            -DWITH_TLS=OFF \
            -DIRC_LSAN_PROBE=ON \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }}
      # THE TARGET NAMES ARE REAL. `cmake --build . --target <typo>` does fail on
      # a name that matches nothing, so this is belt and braces rather than the
      # only defence -- but the artefact assertion below is the decisive one,
      # because it is the only assertion that cannot be satisfied by a build that
      # decided there was nothing to do. The listing is printed so that a reader
      # of the log can see what the names were resolved against.
      - name: Assert the target names are real before building them
        run: |
          set -euo pipefail
          (cmake --build build-probes --target help 2>&1 || true) > build-probes.targets.txt
          for t in ${{ steps.targets.outputs.targets }}; do
            if grep -q -- "$t" build-probes.targets.txt; then
              echo "  target $t: declared by the build system"
            else
              echo "::error::target '$t' does not appear in 'cmake --build --target help' for this compiler." >&2
              echo "::error::A name that matches no target must fail loudly here rather than compile nothing." >&2
              exit 1
            fi
          done
      - name: Build the opt-in probes
        run: |
          set -euo pipefail
          cmake --build build-probes --parallel $(nproc) --target ${{ steps.targets.outputs.targets }} \
            2>&1 | tee build-probes.build.log
      # 0 ERRORS AND 0 WARNINGS, COUNTED ON THE BUILD LOG rather than taken from
      # the exit code. The tree compiles with -Wall -Wextra -Werror and, under
      # Clang, -Weverything, so -Werror already makes a diagnostic fatal on the
      # compilers that have it; the count is here for the shape of the check the
      # rest of this project uses (scripts/gate.sh counts on the log for the same
      # reason: a build that produced no log must not report "0 warnings").
      - name: Assert the probes built clean, exist, and are newer than every source
        run: |
          set -euo pipefail
          errs=$(grep -c 'error:' build-probes.build.log || true)
          warns=$(grep -c 'warning:' build-probes.build.log || true)
          echo "build: errors=$errs warnings=$warns"
          if [ "$errs" != "0" ] || [ "$warns" != "0" ]; then
            grep -m8 -E 'error:|warning:' build-probes.build.log >&2
            exit 1
          fi
          newest_src=$(find "$PWD" \( -name '*.c' -o -name '*.h' \) -not -path './build-probes/*' \
            -print0 | xargs -0 ls -t 2>/dev/null | head -1)
          for t in ${{ steps.targets.outputs.targets }}; do
            bin="build-probes/tests/integration/$t"
            if [ ! -x "$bin" ]; then
              echo "::error::$bin was not produced. A target that builds to nothing must not report success." >&2
              exit 1
            fi
            if [ "$newest_src" -nt "$bin" ]; then
              echo "::error::$bin is older than $newest_src, so it was not rebuilt from this tree." >&2
              exit 1
            fi
            echo "  $bin built, newer than every source in the tree"
          done
      - name: The probes are not RUN here, and here is why
        run: |
          set -euo pipefail
          cat <<'EOF'
          Not a no-op: the probes are deliberately not executed in this job.
            lsan_probe FAILS BY DESIGN wherever LeakSanitizer is absent or off, and
            asan_coverage_probe FAILS BY DESIGN wherever a class it proves is not
            being watched. Both facts belong to the GATE, not to the software, and
            ctest -- and this job's step model -- cannot express that difference.
          The place they run is scripts/gate-linux-cell.sh, which runs the coverage
          probe directly with the cell's own ASAN_OPTIONS and prints one COVER line
          per class, and ci_sanitizers above, which does the same against a hosted
          Linux image. This job's whole claim is that the two files COMPILE under
          three compiler families. A file that will not compile is a file nobody can
          run either, and that is the defect this job removes.
          EOF

  # --- scripts/teeth-linux.sh gets a home, and it is an automatic one -------
  # THE PROBLEM. scripts/teeth-linux.sh is the only instrument in this repository
  # that can answer "does THIS image's ASan actually watch stack-use-after-return",
  # and it is the only thing standing between a change to the Linux cell's
  # ASAN_OPTIONS and an unverified claim. It was in no workflow and no Makefile,
  # which means a change to those options would not be re-checked by any
  # automated run until a human remembered. An instrument nothing runs is a
  # comment, and the failure it permits is exactly the one this pass is about: a
  # cell that reports a count of findings in a class nobody watched.
  #
  # WHY THE SELF-HOSTED RUNNER AND NOT ubuntu-22.04. The script refuses to start
  # anywhere but Linux with docker and one specific image present, and the image is
  # a debian:bookworm this project builds by hand. Running it on a hosted image
  # would mean rebuilding that image on every run and would then be measuring a
  # DIFFERENT image's ASan while the file's whole claim is about this one.
  # cachyos-x8664 already runs ci_linux, already has the image, and already has
  # docker. The exposure note in this file's header applies unchanged: anything
  # that reaches this runner executes code there, which is why the environment
  # below is the same one ci_linux_cachyos uses and why the schedule is the
  # default path.
  #
  # WHY IT IS NOT ON EVERY PUSH. It builds a sanitized tree inside a container for
  # a control and a fault, which is minutes of work, and scripts/teeth.sh is not on
  # a push either for the same reason. A nightly is the right cadence: it is slow
  # enough to be cheap and frequent enough that a change to ASAN_OPTIONS is
  # verified within a day rather than at the next release.
  #
  # `workflow_dispatch` IS THE PART THAT MAKES IT USEFUL BEFORE A MERGE rather than
  # after one: it is how a change to the options gets proven before it lands.
  ci_teeth_linux:
    name: ci_teeth_linux (nightly)
    runs-on: [self-hosted, Linux, X64, cachyos-x8664]
    timeout-minutes: 60
    environment:
      name: ${{ github.actor == 'TheFirstIstari' && 'self-hosted-auto' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - name: Machine and image
        run: |
          set -euo pipefail
          echo "  host   : $(uname -srm)"
          echo "  distro : $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "  docker : $(docker --version)"
          docker image inspect "${GATE_LINUX_IMAGE:-ircserve-lsan:bookworm}" >/dev/null 2>&1 || {
            echo "::error::the pinned sanitizer image is not present on this runner; scripts/teeth-linux.sh would SKIP and a skip is not a result" >&2
            exit 1
          }
      # THE EXIT STATUS IS PROPAGATED and never rewritten. This script has THREE
      # outcomes on purpose -- 0 caught, 1 not caught, 3 could not run -- and the
      # third is not a success. A workflow step that turned 3 into 0 would be the
      # same class of defect as a report that prints a count of findings in a
      # class nobody watched: a green tick about work that did not happen.
      - name: Run the Linux teeth
        env:
          GATE_LINUX_IMAGE: ircserve-lsan:bookworm
        run: |
          set -uo pipefail
          ./scripts/teeth-linux.sh
          rc=$?
          case "$rc" in
            0) echo "::notice::teeth-linux: every fault caught and every control green" ;;
            3) echo "::error::teeth-linux: SKIPPED -- no docker, no image, or not Linux. That is not a pass." >&2
               exit 1 ;;
            *) echo "::error::teeth-linux: at least one fault was NOT caught. See the log above." >&2
               exit 1 ;;
          esac

  # --- Advisory only, hosted ---------------------------------------------
  # Benchmark and compliance run on the hosted runner rather than the
  # self-hosted one so that their results are produced by infrastructure the
  # owner does not control. Neither is a required check, so they cost nothing
  # in merge latency and their numbers are independent of the fast machine.
  ci_benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARK=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Benchmark
        working-directory: build
        run: ctest -L Benchmark --output-on-failure --timeout 60

  ci_compliance:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Compliance Tests
        working-directory: build
        run: ctest -L Compliance --output-on-failure --timeout 60
